name: Build and release Skill

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip if this tag is already fully released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          ver="${tag#v}"
          skip=true

          archive="grok-build-skill-${tag}.zip"
          checksum="${archive}.sha256"
          if release_json="$(gh release view "$tag" --json isDraft,assets 2>/dev/null)"; then
            if printf "%s\n" "$release_json" | jq -e --arg archive "$archive" --arg checksum "$checksum" \
              '(.isDraft | not) and ([.assets[].name] | index($archive) != null) and ([.assets[].name] | index($checksum) != null)' \
              >/dev/null; then
              echo "GitHub release $tag is published with required assets"
            else
              echo "GitHub release $tag is draft or missing assets"
              skip=false
            fi
          else
            echo "GitHub release $tag does not exist"
            skip=false
          fi

          packages=(
            "@asural/grok-bridge-win32-x64"
            "@asural/grok-bridge-win32-arm64"
            "@asural/grok-bridge-linux-x64"
            "@asural/grok-bridge-linux-arm64"
            "@asural/grok-bridge-darwin-x64"
            "@asural/grok-bridge-darwin-arm64"
            "@asural/grok-bridge"
            "grok-bridge-rs"
          )

          for name in "${packages[@]}"; do
            if npm view "$name@$ver" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Already published: $name@$ver"
            else
              echo "Missing npm package: $name@$ver"
              skip=false
            fi
          done

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  webui:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - name: Upload webui-dist
        id: upload-webui
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error
          retention-days: 1
      - name: Wait before retrying webui-dist upload
        if: steps.upload-webui.outcome == 'failure'
        run: sleep 15
      - name: Retry upload webui-dist
        if: steps.upload-webui.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  build:
    needs: [gate, webui]
    if: needs.gate.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/grok-bridge.exe
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: target/aarch64-pc-windows-msvc/release/grok-bridge.exe
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/grok-bridge
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/grok-bridge
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/grok-bridge
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/grok-bridge
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: webui-dist
          path: webui/dist
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          # Ubuntu ARM runners use ports.ubuntu.com. Prefer HTTPS, force IPv4,
          # and retry transient mirror/network failures.
          sudo sed -i \
            -e 's#http://ports.ubuntu.com/ubuntu-ports#https://ports.ubuntu.com/ubuntu-ports#g' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true

          export DEBIAN_FRONTEND=noninteractive
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::ForceIPv4=true
          )
          timeout 180 sudo apt-get "${apt_opts[@]}" update
          timeout 180 sudo apt-get "${apt_opts[@]}" install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets --all-features -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Upload binary
        id: upload-binary
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1
      - name: Wait before retrying binary upload
        if: steps.upload-binary.outcome == 'failure'
        run: sleep 15
      - name: Retry upload binary
        if: steps.upload-binary.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release:
    needs: [gate, build]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          pattern: binary-*
          path: artifacts

      - name: Assemble Skill archive
        shell: bash
        run: |
          set -euo pipefail
          root="package/grok-build"
          mkdir -p \
            "$root/agents" \
            "$root/hooks/windows" \
            "$root/hooks/unix" \
            "$root/bin/windows-x86_64" \
            "$root/bin/windows-arm64" \
            "$root/bin/linux-x86_64" \
            "$root/bin/linux-arm64" \
            "$root/bin/macos-x86_64" \
            "$root/bin/macos-arm64"

          install -m 0644 README.md "$root/README.md"
          install -m 0644 README-CN.md "$root/README-CN.md"
          install -m 0644 SKILL.md "$root/SKILL.md"
          install -m 0644 agents/openai.yaml "$root/agents/openai.yaml"
          install -m 0644 hooks/windows/grok-bridge.json "$root/hooks/windows/grok-bridge.json"
          install -m 0644 hooks/unix/grok-bridge.json "$root/hooks/unix/grok-bridge.json"
          install -m 0755 artifacts/binary-windows-x86_64/grok-bridge.exe "$root/bin/windows-x86_64/grok-bridge.exe"
          install -m 0755 artifacts/binary-windows-arm64/grok-bridge.exe "$root/bin/windows-arm64/grok-bridge.exe"
          install -m 0755 artifacts/binary-linux-x86_64/grok-bridge "$root/bin/linux-x86_64/grok-bridge"
          install -m 0755 artifacts/binary-linux-arm64/grok-bridge "$root/bin/linux-arm64/grok-bridge"
          install -m 0755 artifacts/binary-macos-x86_64/grok-bridge "$root/bin/macos-x86_64/grok-bridge"
          install -m 0755 artifacts/binary-macos-arm64/grok-bridge "$root/bin/macos-arm64/grok-bridge"

          test "$(find "$root" -type f | wc -l)" -eq 12
          for hook in "$root/hooks/windows/grok-bridge.json" "$root/hooks/unix/grok-bridge.json"; do
            jq -e '.hooks | length == 14' "$hook" >/dev/null
            jq -e '[.hooks[][].hooks[] | select(.env.GROK_BRIDGE_HOOK_PROTOCOL == "4")] | length == 14' "$hook" >/dev/null
          done
          test -x "$root/bin/linux-x86_64/grok-bridge"
          test -x "$root/bin/linux-arm64/grok-bridge"
          test -x "$root/bin/macos-x86_64/grok-bridge"
          test -x "$root/bin/macos-arm64/grok-bridge"

          archive="grok-build-skill-${GITHUB_REF_NAME}.zip"
          (cd package && zip -r "../$archive" grok-build)
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="grok-build-skill-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$archive" "$archive.sha256" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
              --verify-tag \
              --generate-notes \
              --title "grok-build ${GITHUB_REF_NAME}"
          fi

  cleanup:
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' && needs.release.result == 'success' && needs.publish-npm.result == 'success' }}
    needs: [gate, release, publish-npm]
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )"
          for artifact_id in $artifact_ids; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

  publish-npm:
    needs: [gate, release]
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@asural"

      - uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          pattern: binary-*
          path: artifacts

      - name: Update package versions
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NPM_VERSION="${VERSION#v}"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const version = process.env.NPM_VERSION || process.env.VERSION.replace(/^v/, '');
          const packageDirs = ['win32-x64', 'win32-arm64', 'linux-x64', 'linux-arm64', 'darwin-x64', 'darwin-arm64'];
          const entryManifests = ['package.json', path.join('packages', 'grok-bridge-rs', 'package.json')];
          for (const manifestPath of entryManifests) {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = version;
            for (const dependency of Object.keys(manifest.optionalDependencies || {})) {
              manifest.optionalDependencies[dependency] = version;
            }
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          }
          for (const directory of packageDirs) {
            const manifestPath = path.join('packages', directory, 'package.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = version;
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          }
          NODE

      - name: Stage platform npm packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/{win32-x64,win32-arm64,linux-x64,linux-arm64,darwin-x64,darwin-arm64}/bin
          cp artifacts/binary-windows-x86_64/grok-bridge.exe packages/win32-x64/bin/grok-bridge.exe
          cp artifacts/binary-windows-arm64/grok-bridge.exe packages/win32-arm64/bin/grok-bridge.exe
          cp artifacts/binary-linux-x86_64/grok-bridge packages/linux-x64/bin/grok-bridge
          cp artifacts/binary-linux-arm64/grok-bridge packages/linux-arm64/bin/grok-bridge
          cp artifacts/binary-macos-x86_64/grok-bridge packages/darwin-x64/bin/grok-bridge
          cp artifacts/binary-macos-arm64/grok-bridge packages/darwin-arm64/bin/grok-bridge
          chmod +x packages/linux-*/bin/grok-bridge packages/darwin-*/bin/grok-bridge

      - name: Stage top-level npm packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages/grok-bridge-rs/bin
          cp bin/cli.js packages/grok-bridge-rs/bin/cli.js
          cp README.md README-CN.md LICENSE packages/grok-bridge-rs/

      - name: Publish platform npm packages
        id: publish-platform
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for directory in win32-x64 win32-arm64 linux-x64 linux-arm64 darwin-x64 darwin-arm64; do
            name=$(node -p "require('./packages/$directory/package.json').name")
            version=$(node -p "require('./packages/$directory/package.json').version")
            if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
              echo "Already published: $name@$version"
            elif npm publish "./packages/$directory" --registry https://registry.npmjs.org --access public --provenance; then
              echo "Published: $name@$version"
            else
              echo "Failed to publish: $name@$version"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more platform packages failed"
            exit 1
          fi

      - name: Publish scoped compatibility npm package
        id: publish-scoped
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Already published: $name@$version"
          elif npm publish --registry https://registry.npmjs.org --access public --provenance; then
            echo "Published: $name@$version"
          else
            echo "Failed to publish: $name@$version"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Package step failed"
            exit 1
          fi

      - name: Publish top-level npm package
        id: publish-toplevel
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          name=$(node -p "require('./packages/grok-bridge-rs/package.json').name")
          version=$(node -p "require('./packages/grok-bridge-rs/package.json').version")
          if npm view "$name@$version" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "Already published: $name@$version"
          elif npm publish ./packages/grok-bridge-rs --registry https://registry.npmjs.org --access public --provenance; then
            echo "Published: $name@$version"
          else
            echo "Failed to publish: $name@$version"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Package step failed"
            exit 1
          fi

      - name: Fail job if any npm publish failed
        if: steps.publish-platform.outcome == 'failure' || steps.publish-scoped.outcome == 'failure' || steps.publish-toplevel.outcome == 'failure'
        run: exit 1
